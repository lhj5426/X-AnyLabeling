language: en_US
model_hub: github  # github, modelscope
auto_save: true
display_label_popup: true
store_data: false
keep_prev: false
keep_prev_scale: false
keep_prev_brightness: false
keep_prev_contrast: false
auto_use_last_label: false
auto_highlight_shape: true
auto_switch_to_edit_mode: true
show_groups: false
show_texts: true
show_labels: true
show_scores: true
show_degrees: false
show_shapes: true
show_linking: true
show_attributes: true
show_order: true
logger_level: info
system_clipboard: false
switch_to_checked: false

flags: null
label_flags: null
labels: null
file_search: null
sort_labels: true
validate_label: null

default_shape_color: [0, 255, 0]
shape_color: auto  # null, 'auto', 'manual'
shift_auto_shape_color: 0
label_colors: null

manually_edited_color: '#0000FF'  # Blue - 手动编辑颜色

traffic_light_colors:
  selected: [255, 0, 0] # Red
  edited: [0, 255, 0] # Green
  locked: [255, 255, 0] # Yellow
  unlocked: [0, 0, 255] # Blue

shape:
  # drawing
  line_color: [0, 255, 0, 128]
  fill_color: [220, 220, 220, 150]
  vertex_fill_color: [0, 255, 0, 255]
  # selecting / hovering
  select_line_color: [255, 255, 255, 255] # For "Highlight All"
  canvas_select_line_color: [255, 0, 0, 255]
  canvas_hover_line_color: [0, 255, 255, 255]
  # Optional widths (pixels). If null/omitted, fallback to line_width
  select_line_width: null
  canvas_select_line_width: null
  canvas_hover_line_width: null
  navigator_select_line_color: [255, 0, 255, 255]
  navigator_hover_line_color: [255, 255, 0, 255]
  select_fill_color: [0, 255, 0, 155]
  shape_fill_alpha_idle: 50
  shape_fill_alpha_highlight: 180
  hvertex_fill_color: [255, 255, 255, 255]
  # overlap visualization
  overlap_color: [255, 165, 0, 120]
  # alignment tool
  alignment_reference_color: [255, 0, 255, 255]  # Magenta for reference shape
  alignment_target_color: [255, 165, 0, 255]     # Orange for target shapes
  alignment_reference_line_width: 4.0
  alignment_target_line_width: 2.0
  point_size: 10  # 控制多边形等形状的圆形控制点大小
  square_size: 10  # 控制矩形的方形控制块大小
  line_width: 4

# main
flag_dock:
  show: true
  closable: false
  movable: false
  floatable: false
label_dock:
  show: true
  closable: false
  movable: false
  floatable: false
shape_dock:
  show: true
  closable: false
  movable: false
  floatable: false
file_dock:
  show: true
  closable: false
  movable: false
  floatable: false

# navigator
navigator:
  visible: false
  position_x: 100
  position_y: 100
  width: 220
  height: 280

# label_dialog
show_label_text_field: true
label_completion: startswith
move_mode: auto  # 'auto', 'center'
fit_to_content:
  column: true
  row: false

# canvas
epsilon: 10.0
canvas:
  # None: do nothing
  # close: close polygon
  double_click: close
  # change mode
  # The max number of edits we can undo
  num_backups: 10
  wheel_rectangle_editing:
    # Edge adjustment (mouse outside rectangle)
    adjust_step_h: 1.0          # Normal scroll - horizontal edge
    adjust_step_v: 1.0          # Normal scroll - vertical edge
    shift_adjust_step_h: 5.0    # Shift+scroll - horizontal edge
    shift_adjust_step_v: 5.0    # Shift+scroll - vertical edge
    fast_adjust_step_h: 10.0    # Ctrl+scroll - horizontal edge
    fast_adjust_step_v: 10.0    # Ctrl+scroll - vertical edge
    # Inner scale (mouse inside rectangle)
    scale_step_h: 3.0           # Normal scroll - expand width
    scale_step_v: 3.0           # Ctrl+scroll - expand height
  crosshair:
    show: true
    style: dash  # "dash" or "solid"
    width: 2.0
    color: "#00FF00"
    opacity: 0.5
  zoom_at_mouse_percentage_increase: 20
  zoom_at_mouse_shortcut: Ctrl+B

shortcuts:
  add_point_to_edge: Ctrl+Shift+P
  alignment_tool: Ctrl+Shift+R
  auto_label: Ctrl+Shift+A
  auto_run: Ctrl+M
  cancel_paste_preview: Ctrl+D
  close: Ctrl+W
  copy_polygon: Ctrl+C
  create_circle: null
  create_line: null
  create_linestrip: null
  create_point: null
  create_polygon: [P, Ctrl+N]
  create_rectangle: [R, Ctrl+R]
  create_rotation: O
  create_rotation3: H
  delete_file: Ctrl+Delete
  delete_image_file: Ctrl+Shift+Delete
  delete_polygon: Delete
  deselect_all_labels: Alt+W
  deselect_all_shapes: Alt+S
  duplicate_polygon: Ctrl+D
  edit_digit_shortcut: Alt+D
  edit_group_id: Alt+G
  edit_label: Ctrl+E
  edit_polygon: Ctrl+J
  expand_margins: Ctrl+Shift+M
  fit_width: Ctrl+Shift+F
  fit_window: Ctrl+F
  group_selected_shapes: G
  hide_selected_polygons: S
  invert_selection_labels: Alt+E
  invert_selection_shapes: Alt+I
  keymap_dialog: Ctrl+Shift+U
  loop_thru_labels: N
  object_manager: Ctrl+T
  open: Ctrl+I
  open_chatbot: null
  open_dir: Ctrl+U
  open_next: [D, Ctrl+Shift+D]
  open_next_unchecked: Ctrl+Shift+D
  open_prev: [A, Ctrl+Shift+A]
  open_prev_unchecked: Ctrl+Shift+A
  open_video: Ctrl+O
  open_vqa: null
  paste_polygon: Ctrl+V
  quit: Ctrl+Q
  remove_selected_point: Backspace
  save: Ctrl+S
  save_as: Ctrl+Shift+S
  save_to: null
  segmentation_tool: Ctrl+Shift+X
  select_all_labels: Alt+Q
  select_all_shapes: Alt+T
  select_all_shapes_canvas: Ctrl+A
  show_attributes: Ctrl+Shift+L
  show_hidden_polygons: W
  show_labels: Ctrl+L
  show_linking: null
  show_navigator: Alt+Z
  show_order: Ctrl+Shift+O
  show_overview: Ctrl+G
  show_texts: null
  show_wh: Ctrl+Shift+W
  toggle_auto_use_last_label: Ctrl+K
  toggle_crosshair: Ctrl+Shift+H
  toggle_degrees: Ctrl+Alt+D
  toggle_highlight: Alt+F
  toggle_keep_prev_mode: Ctrl+P
  toggle_overlap: Alt+R
  toggle_visibility_shapes: Ctrl+H
  undo: Ctrl+Z
  undo_last_point: Ctrl+Z
  ungroup_selected_shapes: U
  union_selected_shapes: M
  zoom_in: [Ctrl++, Ctrl+=]
  zoom_out: Ctrl+-
  zoom_to_original: Ctrl+0

# Auto labeling
custom_models: []

# Digit shortcuts
digit_shortcuts: null

# Smart guides (辅助线)
smart_guides_enabled: true  # 是否显示辅助线
smart_guides_enable_snap: true  # 是否启用辅助线吸附功能（可以只显示辅助线不吸附）
smart_guides_show_horizontal: true  # 是否显示水平辅助线
smart_guides_show_vertical: true  # 是否显示垂直辅助线
smart_guides_line_width: 2.0
smart_guides_line_color: [255, 0, 255]
smart_guides_opacity: 0.8
smart_guides_display_distance: 100  # 辅助线显示距离（像素）- 在此距离内才检测和显示辅助线
smart_guides_snap_distance: 10  # 吸附距离（像素）- 磁铁效果，在此距离内才自动吸附
smart_guides_max_lines: 10  # 最大辅助线条数 - 只显示最近的N条
# 辅助线方向吸附开关（可以独立控制每个方向的吸附，只有4条边）
smart_guides_snap_left: true  # 是否启用左边对齐吸附
smart_guides_snap_right: true  # 是否启用右边对齐吸附
smart_guides_snap_top: true  # 是否启用上边对齐吸附
smart_guides_snap_bottom: true  # 是否启用下边对齐吸附
# 粘贴模式辅助线
smart_guides_paste_preview_enabled: true
smart_guides_paste_show_guides: true  # 粘贴模式下是否显示辅助线
smart_guides_paste_enable_snap: true  # 粘贴模式下是否启用吸附功能
smart_guides_paste_snap_distance: 10  # 粘贴模式下的吸附距离（像素）
# 粘贴模式方向吸附开关（可以独立控制每个方向的吸附，只有4条边）
smart_guides_paste_snap_left: true  # 粘贴模式：是否启用左边对齐吸附
smart_guides_paste_snap_right: true  # 粘贴模式：是否启用右边对齐吸附
smart_guides_paste_snap_top: true  # 粘贴模式：是否启用上边对齐吸附
smart_guides_paste_snap_bottom: true  # 粘贴模式：是否启用下边对齐吸附

# Rectangle spacing guide (矩形间距线)
spacing_guide_enabled: true
spacing_guide_line_width: 2.0
spacing_guide_line_color: [0, 255, 255]  # 青色
spacing_guide_text_bg_color: [0, 0, 0, 150]  # 文字背景色（RGBA）
spacing_guide_opacity: 0.8
spacing_guide_display_distance: 500  # 间距线显示距离（像素）
spacing_guide_snap_distance: 10  # 间距线吸附距离（像素）
spacing_guide_max_shapes: 0  # 最多检测的矩形数量（0表示检测所有）

# Paste preview (虚影)
paste_preview_line_width: 2.0
paste_preview_line_color: [255, 0, 255]
paste_preview_opacity: 0.4
paste_preview_fill_opacity: 0.3

# Highlight settings
highlight_positive: ""
highlight_negative: ""
highlight_mixed_mode: false
highlight_enabled_by_default: true
locked_labels: ""
pin_labels: ""
no_highlight_labels: ""
